version: 1

workflow:
  state_labels:
    needs_info: "ai:needs-info"
    ready: "ai:ready"
    in_progress: "ai:in-progress"
    pr_open: "ai:pr-open"
    needs_human: "ai:needs-human"
    blocked: "ai:blocked"
  block_labels: ["ai:disabled"]
  allow_labels: ["ai"]

  engagement:
    default:
      allow: []
    repositories: {}

lifecycle:
  plugin:
    manifest_path: /plugins/example/donkeyspace-plugin.yml
    flow: work_items
    max_handoffs_per_edge: 2
    environment:
      PLUGIN_MODEL: WORKER_PLUGIN_MODEL

checks:
  required_commands:
    - name: "diff whitespace"
      command: ["git", "diff", "--check"]
  require_github_checks: false

risk:
  default: "unknown"
  agent_classification: true
  route_unknown_to_human: false
  route_high_to_human: true
  human_review_paths: []

automation:
  max_concurrent_jobs: 1
  retry_failed_jobs: false
  auto_merge: false

dashboard:
  # public_url: https://agents.example.com
  expose_policy: true
  allow_retry: true
  allow_cancel: false
