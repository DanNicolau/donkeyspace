version: 2

workflow:
  state_labels:
    needs_info: "ai:needs-info"
    ready: "ai:ready"
    in_progress: "ai:in-progress"
    pr_open: "ai:pr-open"
    needs_human: "ai:needs-human"
    blocked: "ai:blocked"
  block_labels: ["ai:disabled"]
  allow_labels: ["ai"]

  engagement:
    default:
      allow: []
    repositories: {}

lifecycle:
  plugin:
    manifest_path: /plugins/example/donkeyspace-plugin.yml
    flow: work_items
    max_handoffs_per_edge: 2
    environment:
      PLUGIN_MODEL: WORKER_PLUGIN_MODEL

checks:
  required_commands:
    - name: "diff whitespace"
      command: ["git", "diff", "--check"]

risk:
  route_unknown_to_human: false
  route_high_to_human: true
  human_review_paths: []

dashboard:
  # public_url: https://agents.example.com
  allow_retry: true
