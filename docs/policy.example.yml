# Example donkeyspace policy for a single GitHub repository.

version: 1

workflow:
  state_labels:
    needs_info: "ai:needs-info"
    ready: "ai:ready"
    in_progress: "ai:in-progress"
    pr_open: "ai:pr-open"
    needs_human: "ai:needs-human"
    blocked: "ai:blocked"
  block_labels:
    - "ai:disabled"
    - "wontfix"
  allow_labels:
    - "ai"

agents:
  triage:
    enabled: true
    command: ["donkeyspace-codex-triage", ".donkeyspace/run-input.json"]
  developer:
    enabled: true
    command: ["donkeyspace-codex-developer", ".donkeyspace/run-input.json"]
  reviewer:
    enabled: true
    command: ["donkeyspace-codex-reviewer", ".donkeyspace/run-input.json"]
  repair:
    enabled: true
    command: ["donkeyspace-codex-repair", ".donkeyspace/run-input.json"]

checks:
  required_commands:
    - name: "diff whitespace"
      command: ["git", "diff", "--check"]
    - name: "rust tests"
      command: ["sh", "-lc", "test ! -f Cargo.toml || cargo test --workspace"]
    - name: "dashboard build"
      command: ["sh", "-lc", "test ! -f web/package.json || (cd web && npm install && npm run build)"]
  require_github_checks: true

risk:
  default: "unknown"
  agent_classification: true
  route_unknown_to_human: true
  route_high_to_human: true
  human_review_paths:
    - ".github/**"
    - "migrations/**"
    - "**/auth/**"
    - "**/billing/**"
    - "**/security/**"

automation:
  max_concurrent_jobs: 2
  retry_failed_jobs: false
  auto_merge: false

dashboard:
  expose_policy: true
  allow_retry: true
  allow_cancel: true
